name: Build desktop app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - os: windows-latest
            args: ""
            rust-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - run: npm install
      - name: Generate Windows ICO resource from the original SVG
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap(256, 256)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::Transparent)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(244, 224, 193))
          $graphics.FillEllipse($brush, 8, 8, 240, 240)
          $dark = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(39, 34, 30))
          $coat = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(183, 119, 61))
          $cream = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(229, 196, 153))
          $leftEar = [System.Drawing.Point[]]@([System.Drawing.Point]::new(50,105),[System.Drawing.Point]::new(44,30),[System.Drawing.Point]::new(95,60))
          $rightEar = [System.Drawing.Point[]]@([System.Drawing.Point]::new(206,105),[System.Drawing.Point]::new(212,30),[System.Drawing.Point]::new(161,60))
          $graphics.FillPolygon($dark, $leftEar)
          $graphics.FillPolygon($dark, $rightEar)
          $graphics.FillEllipse($coat, 45, 65, 166, 165)
          $graphics.FillEllipse($dark, 68, 117, 25, 23)
          $graphics.FillEllipse($dark, 163, 117, 25, 23)
          $graphics.FillPolygon($cream, [System.Drawing.Point[]]@([System.Drawing.Point]::new(113,100),[System.Drawing.Point]::new(128,118),[System.Drawing.Point]::new(143,100),[System.Drawing.Point]::new(153,163),[System.Drawing.Point]::new(128,192),[System.Drawing.Point]::new(103,163)))
          $graphics.FillEllipse($dark, 106, 160, 44, 24)
          $graphics.Dispose()
          $bitmap.Save('src-tauri/icons/icon.png', [System.Drawing.Imaging.ImageFormat]::Png)
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Get-Process -Id $PID).Path)
          $stream = [System.IO.File]::Create('src-tauri/icons/icon.ico')
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose()
          $bitmap.Dispose()
      - run: npm run build
      - uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
